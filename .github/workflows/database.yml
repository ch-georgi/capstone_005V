name: Database integrity
on:
  push:
    paths: ['apps/api/**', 'database/**', '.github/workflows/database.yml']
  pull_request:
    paths: ['apps/api/**', 'database/**', '.github/workflows/database.yml']
jobs:
  schemas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: wellq_schema_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test_password@localhost:5432/wellq_schema_test
      TEST_DATABASE_URL: postgresql://postgres:test_password@localhost:5432/wellq_schema_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix apps/api
      - run: npm run db:check-invariants --prefix apps/api
      - run: npm run db:validate --prefix apps/api
      - run: npm run db:generate --prefix apps/api
      - run: npm run typecheck --prefix apps/api
      - run: npm run typecheck:test --prefix apps/api
      - run: npm run build --prefix apps/api
      - run: npm test --prefix apps/api
      - run: node apps/api/node_modules/typescript/bin/tsc --noEmit --project database/tsconfig.json
      - run: python database/tests/test_sqlite.py
      - run: node database/tests/run-local.cjs
      - run: npm run db:migrate:deploy --prefix apps/api
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/postgresql/application_role.sql
      - run: npm run db:seed --prefix apps/api
      - run: npm run db:seed --prefix apps/api
      - run: npm run test:postgres --prefix apps/api
      - run: npm run test:integration --prefix apps/api
