version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: wellq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wellq
      POSTGRES_PASSWORD: wellq_dev_password
      POSTGRES_DB: wellq_dev
    ports:
      - "5432:5432"
    volumes:
      - wellq_postgres_data:/var/lib/postgresql/data

volumes:
  wellq_postgres_data:
