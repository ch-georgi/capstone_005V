services:
  postgres:
    image: postgres:16
    container_name: wellq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wellq
      POSTGRES_PASSWORD: wellq_dev_password
      POSTGRES_DB: wellq_dev
    ports:
      - "5432:5432"
    volumes:
      - wellq_postgres_data:/var/lib/postgresql/data
  minio:
    # Community build from MinIO sources; pinned for reproducible local development.
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    environment:
      - MINIO_ROOT_USER=wellq_minio
      - MINIO_ROOT_PASSWORD=wellq_minio_password
    networks:
      - minio-network
    volumes:
      - minio-volume:/data
    ports:
      - "9222:9000"
      - "9223:9001"
    command: [ "server", "--console-address", ":9001", "/data" ]

volumes:
  wellq_postgres_data:
  minio-volume:
    driver: local

networks:
  minio-network:
    driver: bridge
